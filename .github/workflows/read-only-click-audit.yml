name: Live all-page dashboard audit
on:
  push:
    branches: [audit-clicks-20261127]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/read-only-click-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-dashboard-audit
          path: live-audit-screens
